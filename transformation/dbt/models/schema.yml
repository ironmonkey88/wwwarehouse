version: 2

sources:
  - name: bronze
    schema: bronze
    tables:
      - name: councilors
  - name: bronze_311
    tables:
      - name: service_requests

models:
  - name: stg_councilors
    description: "Staged Somerville Councilor data"
    columns:
      - name: councilor_id
        tests:
          - unique
          - not_null
      - name: councilor_ward
        tests:
          - not_null

  - name: slv_councilors
    description: "Standardized Councilor Registry with Ward IDs"

  - name: fct_311_council_pulse
    description: "Geographic 311 tickets joined to Ward Councilors for accountability."
    columns:
      - name: service_request_id
        tests:
          - unique
          - not_null

  - name: fct_type_distribution
    description: "Categorical breakdown of 311 volume for dashboard rendering."
    columns:
      - name: type
        tests: [not_null]

  - name: fct_ward_distribution
    description: "Geographic breakdown of 311 volume for dashboard rendering."
    columns:
      - name: ward
        tests: [not_null]

  - name: fct_daily_volume
    description: "Temporal trend of 311 volume by date_created."
    columns:
      - name: request_date
        tests: [not_null, unique]

  - name: fct_311_monthly_performance
    description: "Tactical monthly aggregations for demand and backlog tracking."
    columns:
      - name: month_start
        tests: [not_null]
      - name: ward_id
        tests: [not_null]

exposures:
  - name: councilor_accountability_pulse
    type: dashboard
    maturity: high
    url: "file:///Users/gordonwong/WWWarehouse/analytics/evidence/pages/council_report.md"
    description: "Monitors response times and volume per Ward Councilor for 1.16M Somerville 311 tickets."
    owner:
      name: "Gordon Wong"
      email: "gordon@example.com"
    depends_on:
      - ref('fct_311_council_pulse')
